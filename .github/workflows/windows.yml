name: Windows preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Validate installer script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-preview.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build release executable
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/itoc-chatgpt-zh.exe dist/itoc-chatgpt-zh-windows-x64.exe
          $hash = (Get-FileHash dist/itoc-chatgpt-zh-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = New-Object -TypeName System.Text.UTF8Encoding -ArgumentList $false
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/SHA256SUMS.txt'),
            "$hash  itoc-chatgpt-zh-windows-x64.exe`n",
            $utf8
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: itoc-chatgpt-zh-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
          }
          else {
            gh release create $tag dist/* --prerelease --generate-notes --title $tag
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
