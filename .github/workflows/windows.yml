name: Windows preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Validate installer script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-preview.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build release executable
        run: cargo build --release --locked

      - name: Sign release executable
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            Write-Host 'No Windows signing certificate is configured; leaving this development build unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required when a signing certificate is configured.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'itoc-windows-signing.pfx'
          $importedCertificates = @()
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password -Exportable)
            $signingCertificate = $importedCertificates |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $signingCertificate) {
              throw 'The configured PFX does not contain a certificate with a private key.'
            }

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter 'signtool.exe' |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw 'signtool.exe was not found on the Windows runner.'
            }

            & $signTool.FullName sign /sha1 $signingCertificate.Thumbprint /s My /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 'target/release/itoc-chatgpt-zh.exe'
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            foreach ($certificate in $importedCertificates) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify release signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'target/release/itoc-chatgpt-zh.exe'
          Write-Host "Signature status: $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Host "Publisher: $($signature.SignerCertificate.Subject)"
          }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            if ($signature.Status -ne 'Valid') {
              throw 'Tagged releases must carry a valid trusted Authenticode signature.'
            }
            if ($signature.SignerCertificate.PublicKey.Oid.Value -ne '1.2.840.113549.1.1.1') {
              throw 'Smart App Control requires an RSA code-signing certificate.'
            }
            if (-not $signature.TimeStamperCertificate) {
              throw 'Tagged releases must include a trusted timestamp.'
            }
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/itoc-chatgpt-zh.exe dist/itoc-chatgpt-zh-windows-x64.exe
          $hash = (Get-FileHash dist/itoc-chatgpt-zh-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = New-Object -TypeName System.Text.UTF8Encoding -ArgumentList $false
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/SHA256SUMS.txt'),
            "$hash  itoc-chatgpt-zh-windows-x64.exe`n",
            $utf8
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: itoc-chatgpt-zh-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
          }
          else {
            gh release create $tag dist/* --prerelease --generate-notes --title $tag
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
