[package]
name = "itoc-chatgpt-localizer"
version = "0.1.3-preview.1"
edition = "2021"
license = "MIT"
description = "Experimental Chinese locale launcher for the official ChatGPT Windows app"
repository = "https://github.com/sinco-z/itoc-chatgpt-localizer"

[[bin]]
name = "itoc-chatgpt-zh"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
